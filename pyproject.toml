[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbkit"
version = "0.5.0"
description = "A Python package to build and solve Tight-Binding models."
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Charles Poli", email = "cpoli374@gmail.com" }]
maintainers = [{ name = "Charles Poli", email = "cpoli374@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cpoli/tbkit"

[project.optional-dependencies]
continuum = ["sympy>=1.12"]
test = ["pytest>=7", "pytest-cov>=4", "pytest-xdist>=3.2", "sympy>=1.12"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "sphinx-gallery>=0.15", "sympy>=1.12"]

[tool.pytest.ini_options]
# The suite is warning-free; keep it that way. A warning from tbkit itself is
# a defect (e.g. complex energies reaching matplotlib), and one from a test is
# usually the test misusing an API. Add a targeted `ignore::` entry below if a
# dependency ever emits something genuinely out of our control.
filterwarnings = ["error"]
# Run in parallel; worksteal rebalances the few slow Floquet/Hall/KPM tests.
# Pass -n0 to run a single test without the worker startup cost.
addopts = "-n auto --dist worksteal"

[tool.ruff.lint]
# Pyflakes and the pycodestyle errors (ruff's classic defaults, named so a
# ruff upgrade does not change them), minus two that clash with the physics
# notation: `l` is the angular momentum or a length, and short local lambdas
# stand for formulas.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# Imports grouped by feature, each followed by its `__all__` entry.
"tbkit/__init__.py" = ["E402", "F401"]
# `npc = np.char` has to sit between the imports.
"tbkit/system.py" = ["E402"]
# Pre-0.2 module built on star imports.
"tbkit/graphene.py" = ["F403", "F405"]

[tool.mypy]
# No python_version pin: the NumPy >= 2.3 stubs use PEP 695 generics,
# which mypy resolves wrongly when targeting 3.10 (every bare
# ``arr.max()`` fails to match). Check against the running interpreter.
ignore_missing_imports = true
# The type hints are documentation first: check what is annotated, and
# skip the bodies of unannotated functions.
check_untyped_defs = false

[tool.setuptools.packages.find]
include = ["tbkit*"]

[tool.setuptools.package-data]
tbkit = ["py.typed"]

[tool.coverage.run]
source = ["tbkit"]
