name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # One BLAS thread per pytest-xdist worker: the matrices are small, and
    # OpenBLAS's default of one thread per core oversubscribes the runner.
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .[test]
      - run: pytest tests/ -v --cov=tbkit --cov-report=term-missing

  # The oldest NumPy, SciPy and matplotlib that pyproject.toml allows, so the
  # declared floors stay true (NumPy 2-only calls such as np.trapezoid fail
  # here). pyparsing is pinned to matplotlib 3.7's era: newer releases emit a
  # DeprecationWarning from it, which filterwarnings = error would turn into
  # a failure.
  test-minimum-versions:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "numpy==1.24.*" "scipy==1.10.*" "matplotlib==3.7.*" "pyparsing==3.0.*" .[test]
      # NumPy 1.24's batched det can raise spurious floating-point warnings
      # ("divide by zero/invalid value encountered in det") on finite input
      # whose determinant it computes correctly; NumPy 2 does not.
      - run: |
          pytest tests/ -o $'filterwarnings=error\nignore:.* encountered in det:RuntimeWarning'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Rules are set in pyproject.toml ([tool.ruff.lint]).
      - run: pip install "ruff==0.16.*"
      - run: ruff check tbkit

  # Advisory until the existing hints pass: most of the current errors
  # come from the strictness of the NumPy stubs, not from wrong types.
  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mypy .
      - run: mypy tbkit

  # Building the docs re-runs every gallery example, and each one asserts
  # its key numbers, so a change that breaks an example fails here.
  docs:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .[docs]
      - run: make -C docs html
      # The code listings printed in the paper (paper/listings) assert their results too.
      - run: for f in paper/listings/*.py; do python "$f" || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7
